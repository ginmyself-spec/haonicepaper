name: Validate editions

on:
  push:
    paths:
      - "data/news/**"
  pull_request:
    paths:
      - "data/news/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_edition.py data/news
